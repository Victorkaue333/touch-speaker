# Build and release of Touch Speaker (spec distribuicao-windows-macos T6, D3, D6; ADR-10).
#
# - Push of a tag v* (e.g. v0.1.0): builds the Windows installer (.exe) on windows-latest and the macOS app
#   (.dmg + .zip, Apple Silicon only, ad-hoc signature — D2, D4) on macos-14, after typecheck and tests, and
#   publishes both in a GitHub Release with SHA256SUMS.txt.
# - Run by hand (workflow_dispatch): the same builds, kept as workflow artifacts, without publishing — a dry
#   run, e.g. to get a macOS build to test before tagging.
#
# No secret: no certificate and no Apple credential exist (D1, D2). The only token is the GITHUB_TOKEN of the
# run, with write access only in the job that creates the Release (RISK-novo-8). Actions pinned by commit.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.label }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            script: dist:win
            # Exact, version-less names (FR-PKG-16): the README links straight to releases/latest/download/<name>,
            # so a renamed artifact must fail here (if-no-files-found: error), not break the download link.
            artifacts: frontend/release/Touch-Speaker-Setup-win-x64.exe
          - label: macOS arm64
            os: macos-14
            script: dist:mac
            artifacts: |
              frontend/release/Touch-Speaker-mac-arm64.dmg
              frontend/release/Touch-Speaker-mac-arm64.zip
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: frontend
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # allowScripts (package.json) keeps the install scripts of koffi, uiohook-napi and electron-winstaller off:
      # the native modules come as ready binaries (FR-PKG-11). The npm version shows whether it is honoured.
      - name: Versions
        run: node -v && npm -v

      - name: The tag is the version of package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # Packs, runs the package check before writing any artifact (afterPack), then writes the installer.
      - run: npm run ${{ matrix.script }}
      - name: Package check again, on the final folder
        run: npm run verify:package

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: touch-speaker-${{ runner.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: SHA-256
        working-directory: artifacts
        run: |
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          Touch Speaker ${GITHUB_REF_NAME} — ditado por voz: segure uma tecla, fale e o texto aparece no cursor.

          - **Windows 10/11 (x64):** baixe o \`.exe\` e execute. O instalador não é assinado: no aviso "O Windows protegeu o computador", clique em **Mais informações → Executar assim mesmo**.
          - **macOS 13 ou mais novo, Mac com Apple Silicon (M1 ou mais novo):** baixe o \`.dmg\` e arraste o Touch Speaker para Aplicativos. Na primeira abertura de cada versão: botão direito → **Abrir** (macOS 13–14) ou Ajustes do Sistema → Privacidade e Segurança → **Abrir Mesmo Assim** (macOS 15 ou mais novo). Depois, permita **Acessibilidade** e **Microfone**.
          - Cada pessoa usa a própria chave da Groq, colada em Configurações. O app só envia o áudio do ditado para a Groq, com a sua chave.

          Passo a passo: https://github.com/${GITHUB_REPOSITORY}#download · Conferir os arquivos: \`SHA256SUMS.txt\`.
          EOF
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Touch Speaker $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag
